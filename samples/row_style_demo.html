<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="AUIPivot 실행 예제와 바로 적용할 수 있는 JavaScript 설정 코드" />
        <title>AUIPivot | 실행 예제</title>

        <link rel="stylesheet" href="./prism.css" />
        <!-- 동적 예제와 소스 창도 같은 시점에 강조하도록 자동 실행 대신 직접 적용합니다. -->
        <script src="./prism.js" data-manual></script>

        <!-- 탐색과 코드 복사 기능을 먼저 준비합니다. 피벗 실행 코드는 각 HTML에 있습니다. -->
        <script src="./demo-page.js"></script>
        <!-- 본 데모를 위한 JS 파일 -->
<script src="./demo.js"></script>

        


        <!-- 본 데모를 위한 CSS 파일 -->
        <link href="./standalone-demo.css" rel="stylesheet" />

        <!-- AUIPivot CSS 파일 -->
<link href="../AUIPivot/AUIPivot_style.css" rel="stylesheet" />

        <!-- AUIPivot 라이선스 파일 -->
<script src="../AUIPivot/AUIPivotLicense.js"></script>

        <!-- AUIPivot 컴포넌트 JS 파일 -->
<script src="../AUIPivot/AUIPivot.js"></script>

        <!-- 피벗 한국어 메시지 -->
        <script src="../AUIPivot/messages/AUIPivot.messages.kr.js"></script>

        <style>
            /* 제품 테마의 밝기와 Nova 색상에 맞춰 행 구분선을 표시합니다. */
            #pivot_wrap .aui-pivot-body-panel .aui-pivot-table tr td {
                border-bottom: 1px solid var(--aui-border, light-dark(#dcdcdc, #45454b));
            }

            /* light-dark()는 제품의 color-scheme을 따라 밝은 배경과 어두운 배경을 선택합니다. */
            #pivot_wrap .aui-pivot-row-background {
                background: var(--aui-surface, light-dark(#ffffff, #2a2a2c));
            }

            /* 교차 행도 같은 테마의 배경을 사용합니다. Nova에서는 기존 색상 변수를 따릅니다. */
            #pivot_wrap .aui-pivot-alternative-row-background {
                background: var(--aui-surface-alt, light-dark(#f5f5f5, #333338));
            }

            /* 피벗 썸머리 칼럼 스타일 재정의 */
            #pivot_wrap .aui-pivot-summary-column {
                background: inherit;
                font-weight: bold;
            }

            /* 피벗 썸머리 토탈 칼럼 스타일 재정의 */
            #pivot_wrap .aui-pivot-total-summary-column {
                background: inherit;
                font-weight: bold;
            }

            /* 어두운 배경에서도 읽을 수 있도록 푸터와 그룹 행의 강조색을 함께 바꿉니다. */
            #pivot_wrap .aui-pivot-default-footer {
                color: light-dark(#090, #7bd99b);
            }

            /* 브랜치 행 스타일 */
            #pivot_wrap .my-branch-style {
                font-weight: bold;
                color: light-dark(#090, #7bd99b);
            }
        </style>

        <script>
            // AUIPivot 생성 후 반환 ID
            let myPivotID;

            // 시작점
            function init() {
                // AUIPivot 을 생성합니다.
                createPivotGrid();

                // 피벗에 적용할 정적 자동차 판매 자료를 요청합니다.
                requestData("./data/car_sales.json");
            }

            // 정적 JSON을 읽은 뒤 이 데모의 필드 설정과 데이터를 적용합니다.
            function requestData(url) {
                return fetch(url)
                    .then(function (response) {
                        if (!response.ok) throw new Error("자동차 판매 자료를 불러오지 못했습니다.");
                        return response.json();
                    })
                    .then(function (data) {
                        initPivotData(data);
                    })
                    .catch(function (error) {
                        alert(error.message);
                    });
            }

            //AUIPivot 를 생성합니다.
            function createPivotGrid() {
                // 피봇 그리드 속성 설정
                const pivotProps = {
                    // 피벗 패널 사용을 위해 피벗 패널이 생성될 DIV 의 아이디를 지정함.
                    pivotPanelId: "#pivot_panel",

                    // 행 스타일
                    rowStyleFunction: function (rowIndex, item, dataTotalCount) {
                        if (item._$isBranch) {
                            // 브랜치 인 경우
                            return "my-branch-style";
                        }
                    }
                };

                // 실제로 #pivot_wrap 에 그리드 생성
                myPivotID = AUIPivot.create("#pivot_wrap", pivotProps);
            }

            //피벗 그리드 해당 데이터로 초기화 및 피벗팅 시작
            function initPivotData(data) {
                // 행필드
                AUIPivot.setRowFields(myPivotID, ["REGION", "NAME", "MODEL"]);

                // 칼럼 필드
                AUIPivot.setColumnFields(myPivotID, ["DATE_HALF", "DATE_QTR", "DATE_MONTH"]);

                // 값 필드
                AUIPivot.setValueFields(myPivotID, [
                    { "dataField": "TOTAL", "operation": "SUM" },
                    { "dataField": "COUNT", "operation": "SUM" }
                ]);

                // 데이터 중 날짜 필드를 명시하여 연, 반기, 분기 등으로 나눠 표시하도록 지시
                AUIPivot.setDateTypeField(myPivotID, "DATE");

                // 주어진 JSON 데이터의 필드명을 구분하기 쉽게 alias 를 지정합니다.
                // 만약 완전히 다른 데이터로 다시 설정된다면 alias 들도 다시 설정하십시오.
                // [{"REGION":"서울 지점","NAME":"아반테","MODEL":"1.6 GDi","COLOR":"Blue","PRICE":1384000,"COUNT":1,"DATE":"2015/01/01","TOTAL":1384000},{
                AUIPivot.setFieldAlias(myPivotID, {
                    "REGION": "판매 지점",
                    "NAME": "차종",
                    "MODEL": "모델",
                    "COLOR": "색상",
                    "PRICE": "가격",
                    "COUNT": "판매 대수",
                    "TOTAL": "매출액",
                    "DATE": "일",
                    "DATE_YEAR": "년",
                    "DATE_HALF": "반기",
                    "DATE_QTR": "분기",
                    "DATE_MONTH": "월"
                });

                // 피봇그리드에 데이터 삽입
                AUIPivot.setGridData(myPivotID, data);
            }

            // 사용자가 피벗 패널을 닫은 경우 다시 열도록 함.
            function showPivoPanel() {
                if (AUIPivot.getPivotPanelState(myPivotID) == "shown") {
                    AUIPivot.hidePivotPanel(myPivotID);
                    return;
                }
                AUIPivot.showPivotPanel(myPivotID);
            }
        </script>
    </head>

    <body class="standalone-demo">
        <!-- 개별 데모는 단일 HTML 실행 구조를 유지하며 제품 탐색만 공통으로 표시합니다. -->

        <div class="wrap">

                    <code class="demo-api-label">Style</code>
                </div>

                    <span aria-hidden="true">&lt;/&gt;</span>소스 보기

            <div id="main">
                <div class="desc">
                    <p>
                        피벗 그리드의 행 스타일을 동적으로 작성하기 위해 rowStyleFunction 을 설정하고, 원하는 스타일을
                        반환하십시오.

                    <p>또한 행과 행 사이의 라인을 추가로 지정한 모습입입니다.</p>
                    <div>

                    </div>

                <div style="position: relative">
                    <!-- AUIPivot 그리드가 이곳에 생성됩니다. -->
                    <div id="pivot_wrap" style="width: 1000px; height: 600px"></div>
                    <!-- AUIPivot 피벗 필드 패널이 이곳에 생성됩니다. -->
                    <div
