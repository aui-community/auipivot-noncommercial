<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="AUIPivot 실행 예제와 바로 적용할 수 있는 JavaScript 설정 코드" />
<title>AUIPivot v2.8 Samples</title>

<!-- 본 데모를 위한 JS 파일 -->
<script src="./demo.js"></script>

<!-- 본 데모를 위한 CSS 파일 -->
<link href="./demo.css" rel="stylesheet" />

<!-- AUIPivot CSS 파일 -->
<link href="../AUIPivot/AUIPivot_style.css" rel="stylesheet" />

<!-- AUIPivot 라이선스 파일 -->
<script src="../AUIPivot/AUIPivotLicense.js"></script>

<!-- AUIPivot 컴포넌트 JS 파일 -->
<script src="../AUIPivot/AUIPivot.js"></script>

<!-- 피벗 한국어 메시지 -->
<script src="../AUIPivot/messages/AUIPivot.messages.kr.js"></script>

<script>
    // AUIPivot 생성 후 반환 ID
    let myPivotID;

    // 테마와 화면 요소가 준비되면 피벗을 생성하고 원본 자료를 요청합니다.
    function init() {
        // AUIPivot 을 생성합니다.
        createPivotGrid();

        // 피벗팅 할 데이터 요청
        requestData("./data/car_sales.json");
    }

    // 표시 옵션으로 피벗을 생성하고 반환 ID를 보관해 이후 설정과 데이터 입력에 사용합니다.
    function createPivotGrid() {
        // 피봇 그리드 속성 설정
        const pivotProps = {
            // 피벗 패널 사용을 위해 피벗 패널이 생성될 DIV 의 아이디를 지정함.
            pivotPanelId: "#pivot_panel",
            // 피벗 그리드의 높이(height)가 피벗팅 된 결과에 따라 유동적으로 최적화되어 표현될지 여부
            autoGridHeight: true, // 기본값 : true 임
            // autoGridHeight 을 적용할 때 높이가 부모도 같이 적용 시킬지 여부
            // 즉, 데모 상의 #pivot_wrap DIV 가 같이 적용될지 여부.
            autoGridParentHeight: false,
            enableMovingColumn: true
        };

        // 실제로 #pivot_wrap 에 그리드 생성
        myPivotID = AUIPivot.create("#pivot_wrap", pivotProps);
    }

    // 행과 열의 분류와 값 집계를 설정한 뒤 원본을 입력해 보고서를 만듭니다.
    function initPivotData(data) {
        // 세로로 묶어 표시할 행 필드를 상위 항목부터 순서대로 지정합니다.
        AUIPivot.setRowFields(myPivotID, ["REGION", "NAME", "MODEL"]);

        // 가로로 나눌 열 필드를 바깥 분류부터 순서대로 지정합니다.
        AUIPivot.setColumnFields(myPivotID, ["DATE_HALF", "DATE_QTR", "DATE_MONTH"]);

        // 집계할 원본 필드, 연산과 숫자 표시 형식을 지정합니다.
        AUIPivot.setValueFields(myPivotID, [{ "dataField": "TOTAL", "operation": "SUM" }]);

        // 데이터 중 날짜 필드를 명시하여 연, 반기, 분기 등으로 나눠 표시하도록 지시
        AUIPivot.setDateTypeField(myPivotID, "DATE");

        // 준비한 필드 설정에 원본 데이터를 입력해 피벗 집계를 시작합니다.
        AUIPivot.setGridData(myPivotID, data);
    }

    // 피벗 데이터 변경하기
    function changeData(data) {
        //-- 기존의 행, 칼럼, 값, 필터 등이 남아 있는 경우 모두 제거함.
        AUIPivot.clearPivotFieldsAll(myPivotID);

        // 만약, 보고서를 작성하지 않고 초기값으로 놓고 싶다면 다음 3줄 주석 처리
        AUIPivot.setRowFields(myPivotID, ["판매지점"]); // 행
        AUIPivot.setColumnFields(myPivotID, ["차종"]); //열
        AUIPivot.setValueFields(myPivotID, [{ "dataField": "매출액", "operation": "SUM" }]); // 값

        // 데이터 중 날짜 필드를 명시하여 연, 반기, 분기 등으로 나눠 표시하도록 지시
        AUIPivot.setDateTypeField(myPivotID, "판매일");

        // 준비한 필드 설정에 원본 데이터를 입력해 피벗 집계를 시작합니다.
        AUIPivot.setGridData(myPivotID, data);
    }

    //데이터 요청
    function requestData(url) {
        // ajax 로더 표시
        AUIPivot.showAjaxLoader(myPivotID);

        fetch(url)
            .then((res) => {
                if (!res.ok) throw new Error("데이터 요청 실패");
                return res.json();
            })
            .then((data) => {
                // 행과 열의 분류와 값 집계를 설정한 뒤 원본을 입력해 보고서를 만듭니다.
                initPivotData(data);

                // 로더 제거
                //AUIPivot.removeAjaxLoader(myPivotID);
            })
            .catch((err) => console.error("데이터 로딩 오류:", err));
    }

    // 피벗 대상 다른 데이터 요청
    function requestAnotherData() {
        // 같은 차량 자료를 다른 필드 구성으로 바꾸어 새 원본으로 사용합니다.
        const url = "./data/car_sales.json";

        // ajax 로더 표시
        AUIPivot.showAjaxLoader(myPivotID);

        fetch(url)
            .then((res) => {
                if (!res.ok) throw new Error("데이터 요청 실패");
                return res.json();
            })
            .then((data) => {
                // 피벗 그리드 해당 데이터로 초기화 및 피벗팅 대상 변경
                // 기존 필드를 그대로 섞지 않고 필요한 항목으로 새 행을 만듭니다.
                changeData(
                    data.map(function (row) {
                        return { "판매지점": row.REGION, "차종": row.NAME, "매출액": row.TOTAL, "판매일": row.DATE };
                    })
                );

                // 로더 제거
                //AUIPivot.removeAjaxLoader(myPivotID);
            })
            .catch((err) => console.error("데이터 로딩 오류:", err));
    }
</script>
</head>
<body class="standalone-demo">
<!-- 개별 데모는 단일 HTML 실행 구조를 유지하며 제품 탐색만 공통으로 표시합니다. -->
<a class="demo-skip-link" href="#main">본문으로 건너뛰기</a>

<header class="standalone-site-header">
    <div class="standalone-header-inner">
        <!-- 메인과 동일한 데모 이름을 표시하며 버전은 Builder의 version2에서 자동 갱신합니다. -->
        <a class="standalone-brand" href="./index.html" aria-label="AUIPivot 홈"
            ><span class="demo-brand-copy"
                ><span>AUI<strong>Pivot</strong> v<span data-demo-version>2.8</span> Samples</span></span
            ></a
        >
        <nav class="standalone-site-nav" aria-label="제품 탐색">
            <a href="./index.html#sample-menu">데모 메뉴로 돌아가기</a
            ><a href="../documentation/index.html" target="_blank" rel="noopener"
                >개발 문서 <span aria-hidden="true">↗</span></a
            >
        </nav>
    </div>
</header>

<div class="wrap">
    <!-- 설명과 실행 코드는 이 HTML 파일에서 확인할 수 있습니다. -->
    <!-- 현재 탐색 링크와 테마 선택은 v2.6 데모 복원 후에도 유지합니다. -->
    <nav class="demo-navigation" aria-label="데모 안내">
        <a href="./index.html#sample-menu">데모 목록</a>
        <a href="./data/car_sales.json">원본 JSON</a>
    </nav>
    <script src="./demo-theme.js"></script>
    <!-- 탐색과 테마는 위에, 제목과 핵심 API는 같은 줄에 표시합니다. -->
    <header class="demo-page-intro">
        <div class="demo-title-line">
            <h1>보고서의 원본 데이터 변경</h1>
            <code class="demo-api-label">setGridData</code>
        </div>
    </header>
    <div id="main">
        <p>피벗 그리드의 피벗팅 대상 데이터를 변경하는 예제입니다.</p>
        <p>
            예를 들어 특정 기간을 조회해서 서버에서 데이터 가져와 피벗팅을 실행하는 경우 또는 완전히 다른 데이터로
            바꾸는 경우 이 샘플을 참고하십시오.
        </p>
        <div class="desc">
            <button class="btn" onclick="requestAnotherData()">피벗 대상 데이터 변경하기</button>
        </div>
        <div style="position: relative">
            <!-- AUIPivot 그리드가 이곳에 생성됩니다. -->
            <div id="pivot_wrap" style="width: 1000px; height: 600px"></div>
            <!-- AUIPivot 피벗 필드 패널이 이곳에 생성됩니다. -->
            <div id="pivot_panel" style="position: absolute; width: 400px; height: 600px; left: 1020px; top: 0"></div>
        </div>
        <div id="desc"></div>
    </div>
    <div id="footer">
        <div class="copyright">
            <p>
                Copyright © AUISoft Co., Ltd.
                <a href="https://www.auisoft.net" target="_blank" class="link" style="color: #b2ccff"
                    >https://www.auisoft.net</a
                >
            </p>
        </div>
    </div>
</div>
</body>
</html>
