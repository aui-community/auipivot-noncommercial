<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="AUIPivot 실행 예제와 바로 적용할 수 있는 JavaScript 설정 코드" />
        <title>AUIPivot | 실행 예제</title>
        <!-- This project uses Prism.js (https://prismjs.com/) Licensed under the MIT License (https://opensource.org/licenses/MIT) -->
        <link rel="stylesheet" href="./prism.css" />
        <!-- 동적 예제와 소스 창도 같은 시점에 강조하도록 자동 실행 대신 직접 적용합니다. -->
        <script src="./prism.js" data-manual></script>

        <!-- 탐색과 코드 복사 기능을 먼저 준비합니다. 피벗 실행 코드는 각 HTML에 있습니다. -->
        <script src="./demo-page.js"></script>
        <!-- 본 데모를 위한 JS 파일 -->
<script src="./demo.js"></script>

        


        <!-- 본 데모를 위한 CSS 파일 -->
        <link href="./standalone-demo.css" rel="stylesheet" />

        <!-- AUIPivot CSS 파일 -->
<link href="../AUIPivot/AUIPivot_style.css" rel="stylesheet" />

        <!-- AUIPivot 라이선스 파일 -->
<script src="../AUIPivot/AUIPivotLicense.js"></script>

        <!-- AUIPivot 컴포넌트 JS 파일 -->
<script src="../AUIPivot/AUIPivot.js"></script>

        <!-- 피벗 한국어 메시지 -->
        <script src="../AUIPivot/messages/AUIPivot.messages.kr.js"></script>

        <!-- 브라우저 다운로딩 할 수 있는 JS 추가 -->
        <script src="../export_server_samples/FileSaver.min.js"></script>

        <script>
            // AUIPivot 생성 후 반환 ID
            let myPivotID;

            // 시작점
            function init() {
                // AUIPivot 을 생성합니다.
                createPivotGrid();

                // 피벗에 적용할 정적 자동차 판매 자료를 요청합니다.
                requestData("./data/car_sales.json");
            }

            // 정적 JSON을 읽은 뒤 이 데모의 필드 설정과 데이터를 적용합니다.
            function requestData(url) {
                return fetch(url)
                    .then(function (response) {
                        if (!response.ok) throw new Error("자동차 판매 자료를 불러오지 못했습니다.");
                        return response.json();
                    })
                    .then(function (data) {
                        initPivotData(data);
                    })
                    .catch(function (error) {
                        alert(error.message);
                    });
            }

            //AUIPivot 를 생성합니다.
            function createPivotGrid() {
                // 피봇 그리드 속성 설정
                const pivotProps = {
                    // 레이아웃 유형
                    layoutType: "tableCellMerge",
                    // 기본 포맷 스트링
                    defaultFormatString: "#,##0"
                };

                // 실제로 #pivot_wrap 에 그리드 생성
                myPivotID = AUIPivot.create("#pivot_wrap", pivotProps);
            }

            //피벗 그리드 해당 데이터로 초기화 및 피벗팅 시작
            function initPivotData(data) {
                // 행필드
                AUIPivot.setRowFields(myPivotID, ["REGION", "NAME", "MODEL"]);

                // 칼럼 필드
                AUIPivot.setColumnFields(myPivotID, ["DATE_QTR"]);

                // 필터 필드, 원하면 주석 제거
                //AUIPivot.setFilterFields(myPivotID, ["COLOR"]);

                // 값 필드
                AUIPivot.setValueFields(myPivotID, [
                    {
                        "dataField": "TOTAL",
                        "operation": "SUM",
                        "customLabelText": "매출 합계"
                    },
                    {
                        "dataField": "COUNT",
                        "operation": "SUM",
                        "customLabelText": "판매 대수"
                    }
                ]);

                // 데이터 중 날짜 필드를 명시하여 연, 반기, 분기 등으로 나눠 표시하도록 지시
                AUIPivot.setDateTypeField(myPivotID, "DATE");

                // 피봇그리드에 데이터 삽입
                AUIPivot.setGridData(myPivotID, data);
            }

            // 엑셀로 저장
            function exportToXlsx() {
                // 엑셀 내보내기 속성
                const exportProps = {
                    fileName: "AUIPivot_보고서",
                    // 엑셀 상의 고정 칼럼 적용 안시킴.  (기본값은 그리드의 고정 칼럼대로 출력)
                    fixedColumnCount: 0,
                    // 헤더 내용
                    headers: [
                        {
                            text: "",
                            height: 20 // 첫행 빈줄
                        },
                        {
                            text: "2024년 분기별 지역 매출 내역",
                            height: 24,
                            style: {
                                fontSize: 20,
                                color: "#009900",
                                textAlign: "center",
                                fontWeight: "bold",
                                underline: true,
                                background: "#DAD9FF"
                            }
                        },
                        {
                            text: "작성자 : 에이유아이",
                            style: { textAlign: "right" }
                        },
                        {
                            text: "작성일 : 2025. 03. 29",
                            style: { textAlign: "right" }
                        },
                        {
                            text: "",
                            height: 5,
                            style: { background: "#555555" } // 빈줄 색깔 경계 만듬
                        }
                    ],
                    // 푸터 내용
                    footers: [
                        {
                            text: "",
                            height: 5,
                            style: { background: "#555555" } // 빈줄 색깔 경계 만듬
                        },
                        {
                            text: "참고 : 문의 사항은 전산팀으로 연락 하십시오.",
                            style: { fontSize: 15, color: "#2F9D27" }
                        },
                        {
                            text: "Copyright AUISoft",
                            height: 24,
                            style: { textAlign: "right", fontWeight: "bold", color: "#ffffff", background: "#222222" }
                        }
                    ]
                };
                // 내보내기 실행
                AUIPivot.exportToXlsx(myPivotID, exportProps);
            }
        </script>
    </head>

    <body class="standalone-demo">
        <!-- 개별 데모는 단일 HTML 실행 구조를 유지하며 제품 탐색만 공통으로 표시합니다. -->
<a class="demo-skip-link" href="#main">본문으로 건너뛰기</a>

<header class="standalone-site-header">
    <div class="standalone-header-inner">
        <!-- 메인과 동일한 데모 이름을 표시하며 버전은 Builder의 version2에서 자동 갱신합니다. -->
        <a class="standalone-brand" href="./index.html" aria-label="AUIPivot 홈"
            ><img class="standalone-brand-mark" src="./auipivot-mark.svg" width="40" height="40" alt="" /><span
                class="demo-brand-copy"
                ><span>AUI<strong>Pivot</strong> v<span data-demo-version>2.7</span> DEMO</span></span
            ></a
        >
        <nav class="standalone-site-nav" aria-label="제품 탐색">
            <a href="./index.html#demo-library">데모 메뉴로 돌아가기</a
            ><a href="http://127.0.0.1:8083/index.html" target="_blank" rel="noopener"
                >개발 문서 <span aria-hidden="true">↗</span></a
            >
        </nav>
    </div>
</header>

        <div class="wrap">
            <!-- 설명과 설정 코드는 이 HTML에 두며 전체 소스도 바로 확인할 수 있습니다. -->
            <!-- 현재 탐색 링크와 테마 선택은 v2.6 데모 복원 후에도 유지합니다. -->
            <nav class="demo-navigation" aria-label="데모 안내">
                <a href="./index.html#aggregation-field-guides">데모 목록</a>
                <a href="./data/car_sales.json">원본 JSON</a>
            </nav>
            <script src="./demo-theme.js"></script>
            <!-- 탐색과 테마는 위에, 제목과 핵심 API는 같은 줄에 표시합니다. -->
            <header class="demo-page-intro">
                <div class="demo-title-line">
                    <h1>Excel 제목과 안내 문구</h1>
                    <code class="demo-api-label">exportToXlsx</code>
                </div>
                <button type="button" id="demo-open-source" class="demo-source-button">
                    <span aria-hidden="true">&lt;/&gt;</span>소스 보기
                </button>
            </header>
            <div id="main">
                <div class="desc">
                    <p>
                        엑셀로 내보내기(Export) 할 때 피벗 그리드의 내용 뿐 아니라 상단에 타이틀과 같은 추가 텍스트를
                        작성하여 내보내기 할 수 있습니다.
                    </p>
                    <p>자바스크립트에서 추가 텍스트를 설정하십시오.</p>
                    <p>
                        <button class="btn" onclick="exportToXlsx()">
                            헤더 및 푸터에 추가 텍스트 설정하여 엑셀로 저장하기
                        </button>
                    </p>
                </div>
                <div style="position: relative">
                    <!-- AUIPivot 그리드가 이곳에 생성됩니다. -->
                    <div id="pivot_wrap" style="width: 100%; height: 600px"></div>
                </div>
                <div id="desc"></div>
            </div>
            <div id="footer">
                <div class="copyright">
                    <p>
                        Copyright © AUISoft Co., Ltd.
                        <a href="https://www.auisoft.net" target="_blank" class="link" style="color: #b2ccff"
                            >https://www.auisoft.net</a
                        >
                    </p>
                </div>
            </div>
        </div>
    </body>
</html>
